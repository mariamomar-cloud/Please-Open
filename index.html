<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال مهم جداً!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #ff4757;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4757;
            color: white;
            position: absolute; /* مهم جداً عشان يتحرك بحرية */
            left: 50px;
        }

        #noBtn {
            background-color: #2ed573;
            color: white;
            position: relative;
            right: 50px;
        }

        .message {
            margin-top: 25px;
            font-size: 20px;
            color: #2f3542;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>وحشتك؟ 🤔</h1>
        <div class="buttons-container" id="btnContainer">
            <button id="yesBtn" class="btn">أيوه 🥺</button>
            <button id="noBtn" class="btn">لا 🙄</button>
        </div>
        <div id="resultMessage" class="message"></div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const resultMessage = document.getElementById('resultMessage');
        const card = document.getElementById('mainCard');

        // دالة لتحريك زر "أيوه" عشوائياً داخل الكارت أو الشاشة
        function moveYesButton() {
            const cardRect = card.getBoundingClientRect();
            const btnRect = yesBtn.getBoundingClientRect();

            // حساب أقصى مسافة ممكنة للحركة داخل الكارت
            const maxX = cardRect.width - btnRect.width - 40;
            const maxY = cardRect.height - btnRect.height - 40;

            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

            yesBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // تحريك الزر عند اقتراب الماوس (لأجهزة الكمبيوتر)
        yesBtn.addEventListener('mouseover', moveYesButton);
        
        // تحريك الزر حتى لو حاول الضغط عليه من الموبايل
        yesBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveYesButton();
        });

        // عند الضغط على زر "لا"
        noBtn.addEventListener('click', () => {
            // إخفاء الأزرار والسؤال وإظهار رسالة المصالحة
            document.querySelector('h1').style.display = 'none';
            document.getElementById('btnContainer').style.display = 'none';
            resultMessage.style.display = 'block';
            resultMessage.innerHTML = 'انا زعلت.. هتصالحني بدوناتس جليزد من كرسبي كريم 🍩❤️';
        });
    </script>

</body>
</html>
